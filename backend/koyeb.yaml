kind: app
name: nexus-hms-backend
services:
  - name: api
    type: web
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /**
    regions:
      - oregon
    env:
      - name: PYTHON_VERSION
        value: "3.14"
    build:
      commands:
        - pip install -r requirements.txt
    run:
      command: uvicorn app.main:app --host 0.0.0.0 --port 8000
